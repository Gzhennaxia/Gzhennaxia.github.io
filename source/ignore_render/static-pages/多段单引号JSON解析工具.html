<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>多段单引号JSON解析工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Consolas, "Microsoft YaHei", sans-serif}
body{padding:20px;background:#f5f7fa}
.container{max-width:1400px;margin:0 auto}
.title{text-align:center;margin-bottom:20px;color:#333}
.box{background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-bottom:20px}
h3{margin-bottom:12px;font-size:15px;color:#333}
textarea{width:100%;height:260px;padding:12px;border:1px solid #ddd;border-radius:6px;resize:none;font-size:13px}
.btns{margin:12px 0;display:flex;gap:10px}
button{padding:9px 16px;border:none;border-radius:6px;background:#2d7ff9;color:#fff;cursor:pointer}
button:hover{background:#4292ff}

/* 统计栏 */
.stats{
  padding:10px 14px;
  background:#eef5ff;
  border-radius:6px;
  margin-bottom:10px;
  display:flex;gap:15px;
  font-size:14px;color:#333
}

/* 锚点导航 */
.nav{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:10px;
  background:#f8f9fa;
  border-radius:6px;
  margin-bottom:10px;
}
.nav a{
  padding:4px 10px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:4px;
  font-size:12px;
  cursor:pointer;
  text-decoration:none;
  color:#333
}
.nav a.ok{border-color:#2d7ff9;color:#2d7ff9}
.nav a.fail{border-color:red;color:red}

/* 结果列表 */
#output{
  height:460px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* 单条结果 */
.item{
  position:relative;
  background:#272822;
  color:#fff;
  padding:12px;
  border-radius:6px;
  font-size:13px;
  line-height:1.5;
  white-space:pre-wrap;
}
.item .index{
  position:absolute;
  top:8px;left:10px;
  color:#888;
  font-size:12px;
}

/* 复制按钮 */
.copy-btn{
  position:absolute;
  top:8px;right:8px;
  background:#444;
  color:#fff;
  border:none;
  border-radius:4px;
  width:28px;height:28px;
  cursor:pointer;
  display:flex;
  align-items:center;justify-content:center;
  font-size:14px;
}
.copy-btn:hover{background:#666}
</style>
</head>
<body>

<div class="container">
  <h1 class="title">多段单引号JSON解析工具</h1>

  <!-- 输入区 -->
  <div class="box">
    <h3>📥 多段日志输入（每行一段）</h3>
    <textarea id="input" placeholder="每行粘贴一段单引号JSON，自动分段解析"></textarea>
    <div class="btns">
      <button onclick="startParse()">批量解析</button>
      <button onclick="clearAll()">清空</button>
    </div>
  </div>

  <!-- 结果区 -->
  <div class="box">
    <h3>📊 解析统计 & 快速定位</h3>
    <div class="stats" id="stats"></div>
    <div class="nav" id="nav"></div>

    <h3>📤 分段解析结果</h3>
    <div id="output"></div>
  </div>
</div>

<script>
let results = [];

// 修复单引号JSON
function fixJson(s){
  s = s.replace(/:'(\{[\s\S]*?\})'/g, ':$1');
  s = s.replace(/'/g, '"');
  return s;
}

// 解析单行
function parseLine(str){
  try{
    const t = fixJson(str.trim());
    const o = JSON.parse(t);
    return { ok: true, html: JSON.stringify(o, null, 2) };
  }catch(e){
    return { ok: false, html: "【解析失败】" + str.substring(0,60)+"..." };
  }
}

// 批量解析
function startParse(){
  const text = document.getElementById("input").value;
  const lines = text.split(/\n/).map(i=>i.trim()).filter(i=>i);
  
  const out = document.getElementById("output");
  const nav = document.getElementById("nav");
  const stats = document.getElementById("stats");
  
  out.innerHTML = "";
  nav.innerHTML = "";
  results = [];

  let total = lines.length;
  let ok = 0;
  let fail = 0;

  lines.forEach((line, idx)=>{
    const num = idx + 1;
    const ret = parseLine(line);
    results.push(ret);
    
    if(ret.ok) ok++;
    else fail++;

    // 锚点
    const a = document.createElement("a");
    a.innerText = num;
    a.className = ret.ok ? "ok" : "fail";
    a.onclick = () => {
      document.getElementById(`item-${num}`).scrollIntoView({ behavior:'smooth', block:'start' });
    };
    nav.appendChild(a);

    // 结果卡片
    const item = document.createElement("div");
    item.className = "item";
    item.id = `item-${num}`;
    
    const indexSpan = document.createElement("div");
    indexSpan.className = "index";
    indexSpan.innerText = `#${num}`;
    
    item.textContent = ret.html;
    item.appendChild(indexSpan);

    // 复制按钮
    const copyBtn = document.createElement("button");
    copyBtn.className = "copy-btn";
    copyBtn.innerHTML = "📋";
    copyBtn.onclick = () => {
      const ta = document.createElement("textarea");
      ta.value = ret.html;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      copyBtn.innerHTML = "✅";
      setTimeout(()=>copyBtn.innerHTML="📋",1000);
    };
    item.appendChild(copyBtn);
    out.appendChild(item);
  });

  stats.innerHTML = `
    <div>总段数：${total}</div>
    <div>✅ 成功：${ok}</div>
    <div>❌ 失败：${fail}</div>
  `;
}

// 清空
function clearAll(){
  document.getElementById("input").value = "";
  document.getElementById("output").innerHTML = "";
  document.getElementById("nav").innerHTML = "";
  document.getElementById("stats").innerHTML = "";
  results = [];
}
</script>
</body>
</html>
