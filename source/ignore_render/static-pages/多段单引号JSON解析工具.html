<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>自动括号匹配JSON解析器（带错误定位+按钮居中）</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Consolas, "Microsoft YaHei", sans-serif}
    body{padding:20px;background:#f5f7fa}
    .container{max-width:1400px;margin:0 auto}
    .title{text-align:center;margin-bottom:20px;color:#333}
    .box{background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-bottom:20px}
    h3{margin-bottom:12px;font-size:15px;color:#333}
    textarea{width:100%;height:260px;padding:12px;border:1px solid #ddd;border-radius:6px;resize:none;font-size:13px}
    .btns{margin:12px 0;display:flex;gap:10px}
    button{padding:9px 16px;border:none;border-radius:6px;background:#2d7ff9;color:#fff;cursor:pointer}
    button:hover{background:#4292ff}

    .stats{padding:10px 14px;background:#eef5ff;border-radius:6px;margin-bottom:10px;display:flex;gap:15px;font-size:14px;color:#333}
    .nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:#f8f9fa;border-radius:6px;margin-bottom:10px}
    .nav a{padding:4px 10px;background:#fff;border:1px solid #ddd;border-radius:4px;font-size:12px;cursor:pointer;text-decoration:none;color:#333}
    .nav a.ok{border-color:#2d7ff9;color:#2d7ff9}
    .nav a.fail{border-color:red;color:red}

    #output{height:460px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
    .item{position:relative;background:#272822;color:#fff;padding:12px;border-radius:6px;font-size:13px;line-height:1.5;white-space:pre-wrap;}
    .item .index{position:absolute;top:8px;left:10px;color:#888;font-size:12px;}

    /* ========== 这里修复复制按钮绝对居中 ========== */
    .copy-btn{
      position:absolute;
      top:8px;
      right:8px;
      background:#444;
      color:#fff;
      border:none;
      border-radius:4px;
      width:28px;
      height:28px;
      cursor:pointer;
      /* 核心居中样式 */
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 !important;
      font-size:16px;
      line-height:1;
    }
    .copy-btn:hover{background:#666}

    .error{color:#ff6b6b}
  </style>
</head>
<body>

<div class="container">
  <h1 class="title">自动括号匹配 · 单引号JSON解析器（错误定位版）</h1>

  <div class="box">
    <h3>📥 粘贴整段日志（自动提取所有 { ... } JSON）</h3>
    <textarea id="input" placeholder="直接粘贴一大段混杂文本，自动提取所有JSON"></textarea>
    <div class="btns">
      <button onclick="startParse()">自动提取并解析</button>
      <button onclick="clearAll()">清空</button>
    </div>
  </div>

  <div class="box">
    <h3>📊 解析统计 & 快速定位</h3>
    <div class="stats" id="stats"></div>
    <div class="nav" id="nav"></div>

    <h3>📤 解析结果（失败自动标出错误字符）</h3>
    <div id="output"></div>
  </div>
</div>

<script>
  let results = [];

  // 括号平衡匹配提取所有完整JSON
  function extractAllJsonBlocks(text) {
    const blocks = [];
    let stack = 0, start = -1;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '{') { stack++; if (stack === 1) start = i; }
      else if (c === '}') { stack--; if (stack === 0 && start !== -1) { blocks.push(text.substring(start, i+1)); start = -1; } }
    }
    return blocks;
  }

  // 终极修复单引号嵌套
  function fixJson(s) {
    s = s.replace(/"?:'?\{/g, ':{');
    s = s.replace(/\}'?/g, '}');
    s = s.replace(/'/g, '"');
    return s;
  }

  // 解析 + 精准错误定位
  function parseLine(raw) {
    try {
      const fixed = fixJson(raw);
      const obj = JSON.parse(fixed);
      return {
        ok: true,
        content: JSON.stringify(obj, null, 2)
      };
    } catch (e) {
      const posMatch = e.message.match(/position\s+(\d+)/i);
      const pos = posMatch ? parseInt(posMatch[1]) : -1;
      let errDetail = `❌ 错误：${e.message}`;
      if (pos >= 0 && pos < raw.length) {
        const char = raw[pos];
        const displayChar = char === '\n' ? '[换行]' : char === ' ' ? '[空格]' : char;
        errDetail += `\n🎯 错误位置：第 ${pos} 位`;
        errDetail += `\n🔴 导致失败的字符：[${displayChar}]`;
        errDetail += `\n\n修复前片段：\n${raw.substring(Math.max(0, pos-30), pos+30)}`;
      }
      return { ok: false, content: errDetail };
    }
  }

  // 主解析
  function startParse() {
    const text = document.getElementById("input").value;
    const blocks = extractAllJsonBlocks(text);
    const out = document.getElementById("output");
    const nav = document.getElementById("nav");
    const stats = document.getElementById("stats");

    out.innerHTML = "";
    nav.innerHTML = "";
    results = [];

    let total = blocks.length, okCnt = 0, failCnt = 0;

    blocks.forEach((block, idx) => {
      const num = idx + 1;
      const res = parseLine(block);
      results.push(res);
      res.ok ? okCnt++ : failCnt++;

      const a = document.createElement("a");
      a.innerText = num;
      a.className = res.ok ? "ok" : "fail";
      a.onclick = () => document.getElementById(`item-${num}`).scrollIntoView({ behavior: "smooth" });
      nav.appendChild(a);

      const item = document.createElement("div");
      item.className = "item";
      item.id = `item-${num}`;

      const indexSpan = document.createElement("div");
      indexSpan.className = "index";
      indexSpan.innerText = `#${num}`;
      item.appendChild(indexSpan);
      item.appendChild(document.createTextNode(res.content));

      const copyBtn = document.createElement("button");
      copyBtn.className = "copy-btn";
      copyBtn.innerHTML = "📋";
      copyBtn.onclick = () => {
        const ta = document.createElement("textarea");
        ta.value = res.content;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        copyBtn.innerHTML = "✅";
        setTimeout(() => copyBtn.innerHTML = "📋", 1000);
      };
      item.appendChild(copyBtn);
      out.appendChild(item);
    });

    stats.innerHTML = `
    <div>总提取：${total}</div>
    <div>✅ 成功：${okCnt}</div>
    <div>❌ 失败：${failCnt}</div>
  `;
  }

  function clearAll() {
    document.getElementById("input").value = "";
    document.getElementById("output").innerHTML = "";
    document.getElementById("nav").innerHTML = "";
    document.getElementById("stats").innerHTML = "";
    results = [];
  }
</script>
</body>
</html>
