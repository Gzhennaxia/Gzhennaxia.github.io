<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>百分比 ↔ 分数等式练习</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            secondary: '#059669',
            danger: '#dc2626',
            warn: '#d97706',
            dark: '#0f172a',
          },
          fontFamily: {
            sans: ['Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --bg: #f1f5f9;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --ok: #059669;
      --bad: #dc2626;
      --accent: #2563eb;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --mobile-bar-h: 4.25rem;
    }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #dbeafe 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #d1fae5 0%, transparent 50%),
        var(--bg);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      /* 给手机底部操作栏留空 */
      padding-bottom: calc(var(--mobile-bar-h) + var(--safe-bottom) + 0.5rem);
    }
    @media (min-width: 768px) {
      body {
        padding-bottom: 1.5rem;
      }
    }
    .page-pad {
      padding-left: max(1rem, var(--safe-left));
      padding-right: max(1rem, var(--safe-right));
    }
    .site-header {
      padding-top: max(0.75rem, var(--safe-top));
    }
    .eq-input {
      width: 4.75rem;
      min-height: 2.75rem; /* ≥44px 触控 */
      padding: 0.4rem 0.35rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 0.5rem;
      text-align: center;
      font-size: 16px; /* 防止 iOS 聚焦放大 */
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      background: #fff;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    @media (min-width: 768px) {
      .eq-input {
        width: 5.5rem;
        min-height: 2.25rem;
        font-size: 15px;
      }
    }
    .eq-affix {
      font-weight: 600;
      font-size: 1rem;
      color: #334155;
      font-variant-numeric: tabular-nums;
      user-select: none;
      white-space: nowrap;
    }
    @media (min-width: 768px) {
      .eq-affix { font-size: 0.95rem; }
    }
    .eq-unit {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      max-width: 100%;
    }
    .eq-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .eq-input.correct {
      border-color: var(--ok);
      background: #ecfdf5;
      color: var(--ok);
    }
    .eq-input.wrong {
      border-color: var(--bad);
      background: #fef2f2;
      color: var(--bad);
    }
    .eq-row {
      transition: background 0.2s, transform 0.15s;
    }
    .eq-row.correct-row { background: #ecfdf5; }
    .eq-row.wrong-row { background: #fef2f2; }
    .eq-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      flex: 1;
      min-width: 0;
    }
    .eq-side {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
    }
    .eq-side.left { justify-content: flex-end; }
    .eq-side.right { justify-content: flex-start; }
    .answer-hint {
      display: none;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      padding-top: 0.15rem;
    }
    .answer-hint.is-visible { display: block; }
    @media (min-width: 768px) {
      .answer-hint {
        width: auto;
        text-align: left;
        padding-top: 0;
        margin-left: auto;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .answer-hint.is-visible { display: inline; }
    }
    .quiz-grid {
      display: grid;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .quiz-grid {
        grid-template-columns: 1fr 1fr;
      }
      .quiz-grid .eq-row:nth-child(odd) {
        border-right: 1px solid #f1f5f9;
      }
    }
    .stat-bar {
      height: 6px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .stat-bar > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #dc2626);
      border-radius: inherit;
      transition: width 0.4s ease;
    }
    .fade-in {
      animation: fadeIn 0.35s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .shake {
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }
    .touch-btn {
      min-height: 2.75rem;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    @media (min-width: 768px) {
      .touch-btn { min-height: 2.25rem; }
    }
    /* 手机底部固定操作栏；PC 隐藏，改用顶栏按钮 */
    .mobile-action-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 25;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid #e2e8f0;
      padding: 0.65rem 1rem calc(0.65rem + var(--safe-bottom));
      padding-left: max(1rem, var(--safe-left));
      padding-right: max(1rem, var(--safe-right));
    }
    @media (min-width: 768px) {
      .mobile-action-bar { display: none !important; }
    }
    .pc-actions { display: none; }
    @media (min-width: 768px) {
      .pc-actions { display: flex; }
    }
    #statsModal {
      padding-top: max(1rem, var(--safe-top));
      padding-bottom: max(1rem, var(--safe-bottom));
    }
  </style>
</head>
<body class="font-sans text-dark min-h-screen">
  <header class="site-header sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200">
    <div class="max-w-5xl mx-auto page-pad py-2.5 sm:py-3 flex items-center justify-between gap-2">
      <div class="min-w-0">
        <h1 class="text-base sm:text-xl font-semibold tracking-tight truncate">百分比 ↔ 分数等式练习</h1>
        <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5 hidden xs:block sm:block">36 道题 · 随机空一侧 · 本地统计</p>
      </div>
      <div class="flex items-center gap-2 shrink-0 text-sm">
        <button id="btnStats" type="button" class="touch-btn px-3 rounded-lg border border-slate-200 bg-white active:bg-slate-100 hover:bg-slate-50">
          <i class="fa fa-bar-chart sm:mr-1"></i><span class="hidden sm:inline">统计</span>
        </button>
        <button id="btnNew" type="button" class="touch-btn px-3 rounded-lg bg-primary text-white active:bg-blue-800 hover:bg-blue-700">
          <i class="fa fa-refresh sm:mr-1"></i><span class="hidden sm:inline">重新出题</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto page-pad py-4 sm:py-6 space-y-4 sm:space-y-5">
    <!-- 本轮摘要 -->
    <section id="sessionBar" class="bg-white rounded-xl border border-slate-200 px-3 sm:px-4 py-3">
      <div class="flex items-center justify-between gap-2 text-sm">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          <div>
            <span class="text-slate-500 text-xs sm:text-sm">进度</span>
            <span id="progressText" class="ml-1 font-medium tabular-nums">0 / 36</span>
          </div>
          <div class="hidden sm:block w-px h-4 bg-slate-200"></div>
          <div>
            <span class="text-slate-500 text-xs sm:text-sm">正确率</span>
            <span id="accuracyText" class="ml-1 font-medium tabular-nums text-slate-400">—</span>
          </div>
          <div class="hidden sm:block w-px h-4 bg-slate-200"></div>
          <div>
            <span class="text-slate-500 text-xs sm:text-sm">用时</span>
            <span id="timerText" class="ml-1 font-medium tabular-nums">00:00</span>
          </div>
        </div>
        <div class="pc-actions gap-2 shrink-0">
          <button id="btnCheck" type="button" class="touch-btn px-4 rounded-lg bg-secondary text-white hover:bg-emerald-700 font-medium">
            <i class="fa fa-check mr-1"></i>对答案
          </button>
          <button id="btnShowWrong" type="button" class="touch-btn px-3 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 hidden">
            只看错题
          </button>
        </div>
      </div>
    </section>

    <!-- 题目区 -->
    <section id="quiz" class="bg-white rounded-xl border border-slate-200 overflow-hidden"></section>

    <!-- 对答案结果 -->
    <section id="resultPanel" class="hidden fade-in bg-white rounded-xl border border-slate-200 p-4 sm:p-5">
      <h2 class="font-semibold text-base mb-3"><i class="fa fa-trophy text-amber-500 mr-2"></i>本轮结果</h2>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3 text-center mb-4">
        <div class="rounded-lg bg-slate-50 py-3">
          <div id="resTotal" class="text-xl sm:text-2xl font-semibold tabular-nums">36</div>
          <div class="text-xs text-slate-500 mt-1">总题数</div>
        </div>
        <div class="rounded-lg bg-emerald-50 py-3">
          <div id="resCorrect" class="text-xl sm:text-2xl font-semibold tabular-nums text-secondary">0</div>
          <div class="text-xs text-slate-500 mt-1">正确</div>
        </div>
        <div class="rounded-lg bg-red-50 py-3">
          <div id="resWrong" class="text-xl sm:text-2xl font-semibold tabular-nums text-danger">0</div>
          <div class="text-xs text-slate-500 mt-1">错误 / 空</div>
        </div>
        <div class="rounded-lg bg-blue-50 py-3">
          <div id="resAcc" class="text-xl sm:text-2xl font-semibold tabular-nums text-primary">0%</div>
          <div class="text-xs text-slate-500 mt-1">准确率</div>
        </div>
      </div>
      <div id="wrongList" class="space-y-2 text-sm"></div>
    </section>

    <!-- 历史统计弹层 -->
    <div id="statsModal" class="fixed inset-0 z-30 hidden items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/40">
      <div class="bg-white rounded-t-2xl sm:rounded-xl shadow-xl w-full sm:max-w-lg max-h-[90vh] sm:max-h-[85vh] overflow-hidden flex flex-col">
        <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 class="font-semibold"><i class="fa fa-bar-chart mr-2 text-primary"></i>练习统计</h2>
          <button id="btnCloseStats" type="button" class="touch-btn w-10 rounded-lg hover:bg-slate-100 text-slate-500">
            <i class="fa fa-times"></i>
          </button>
        </div>
        <div class="p-4 overflow-y-auto space-y-4 text-sm overscroll-contain">
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="rounded-lg bg-slate-50 py-3">
              <div id="histRounds" class="text-lg sm:text-xl font-semibold tabular-nums">0</div>
              <div class="text-[11px] sm:text-xs text-slate-500 mt-1">练习轮次</div>
            </div>
            <div class="rounded-lg bg-slate-50 py-3">
              <div id="histAvg" class="text-lg sm:text-xl font-semibold tabular-nums">—</div>
              <div class="text-[11px] sm:text-xs text-slate-500 mt-1">平均正确率</div>
            </div>
            <div class="rounded-lg bg-slate-50 py-3">
              <div id="histBest" class="text-lg sm:text-xl font-semibold tabular-nums">—</div>
              <div class="text-[11px] sm:text-xs text-slate-500 mt-1">最高正确率</div>
            </div>
          </div>
          <div>
            <h3 class="font-medium mb-2 text-slate-700">常错排行（按错误次数）</h3>
            <div id="missRank" class="space-y-2"></div>
            <p id="missEmpty" class="text-slate-400 text-center py-6 hidden">暂无错题记录，继续加油！</p>
          </div>
          <div class="flex gap-2 pt-1 pb-2">
            <button id="btnClearStats" type="button" class="touch-btn px-3 rounded-lg border border-red-200 text-danger hover:bg-red-50 text-xs">
              清空统计
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 手机底部操作栏 -->
  <div class="mobile-action-bar flex gap-2">
    <button id="btnShowWrongMobile" type="button" class="touch-btn flex-1 rounded-xl border border-slate-200 bg-white font-medium text-sm hidden">
      只看错题
    </button>
    <button id="btnCheckMobile" type="button" class="touch-btn flex-[1.4] rounded-xl bg-secondary text-white font-medium text-sm active:bg-emerald-800">
      <i class="fa fa-check mr-1"></i>对答案
    </button>
  </div>

  <footer class="max-w-5xl mx-auto page-pad pb-4 text-center text-[11px] sm:text-xs text-slate-400 leading-relaxed">
    答题只需填数字：百分比填数值（不用写 %），分数填分母（不用写 1/）。统计保存在本机浏览器。
  </footer>

  <script>
    (function () {
      'use strict';

      /**
       * left：百分比数值；right：分数分母（分子固定为 1）
       * leftAlts：可接受的近似数值（字符串）
       * @type {{id:string, left:string, right:string, leftAlts?:string[]}[]}
       */
      const EQUATIONS = [
        // 列 1：小百分比
        { id: '5-1/20', left: '5', right: '20' },
        { id: '3.33-1/30', left: '3.33', right: '30', leftAlts: ['3.3', '3.33', '3.333'] },
        { id: '2.5-1/40', left: '2.5', right: '40' },
        { id: '2-1/50', left: '2', right: '50' },
        { id: '1.67-1/60', left: '1.67', right: '60', leftAlts: ['1.67', '1.6', '1.666', '1.67'] },
        { id: '1.43-1/70', left: '1.43', right: '70', leftAlts: ['1.43', '1.4', '1.428'] },
        { id: '1.25-1/80', left: '1.25', right: '80' },
        { id: '1.11-1/90', left: '1.11', right: '90', leftAlts: ['1.11', '1.1', '1.111'] },
        { id: '1-1/100', left: '1', right: '100' },
        // 列 2
        { id: '50-1/2', left: '50', right: '2' },
        { id: '33.3-1/3', left: '33.3', right: '3', leftAlts: ['33.3', '33.33', '33', '33.333'] },
        { id: '25-1/4', left: '25', right: '4' },
        { id: '20-1/5', left: '20', right: '5' },
        { id: '16.7-1/6', left: '16.7', right: '6', leftAlts: ['16.7', '16.67', '16.6', '16.66', '16.667'] },
        { id: '14.3-1/7', left: '14.3', right: '7', leftAlts: ['14.3', '14.28', '14.29', '14.2', '14.285'] },
        { id: '12.5-1/8', left: '12.5', right: '8' },
        { id: '11.1-1/9', left: '11.1', right: '9', leftAlts: ['11.1', '11.11', '11', '11.111'] },
        { id: '10-1/10', left: '10', right: '10' },
        // 列 3
        { id: '9.1-1/11', left: '9.1', right: '11', leftAlts: ['9.1', '9.09', '9', '9.090'] },
        { id: '8.3-1/12', left: '8.3', right: '12', leftAlts: ['8.3', '8.33', '8', '8.333'] },
        { id: '7.7-1/13', left: '7.7', right: '13', leftAlts: ['7.7', '7.69', '7', '7.692'] },
        { id: '7.1-1/14', left: '7.1', right: '14', leftAlts: ['7.1', '7.14', '7', '7.142'] },
        { id: '6.7-1/15', left: '6.7', right: '15', leftAlts: ['6.7', '6.67', '6.6', '6.666'] },
        { id: '6.25-1/16', left: '6.25', right: '16' },
        { id: '5.9-1/17', left: '5.9', right: '17', leftAlts: ['5.9', '5.88', '5.882'] },
        { id: '5.6-1/18', left: '5.6', right: '18', leftAlts: ['5.6', '5.55', '5.56', '5.555'] },
        { id: '5.3-1/19', left: '5.3', right: '19', leftAlts: ['5.3', '5.26', '5.263'] },
        // 列 4：1/1.x
        { id: '91-1/1.1', left: '91', right: '1.1', leftAlts: ['91', '90.9', '90.91'] },
        { id: '83-1/1.2', left: '83', right: '1.2', leftAlts: ['83', '83.3', '83.33'] },
        { id: '77-1/1.3', left: '77', right: '1.3', leftAlts: ['77', '76.9', '76.92'] },
        { id: '71-1/1.4', left: '71', right: '1.4', leftAlts: ['71', '71.4', '71.43'] },
        { id: '67-1/1.5', left: '67', right: '1.5', leftAlts: ['67', '66.7', '66.67'] },
        { id: '62.5-1/1.6', left: '62.5', right: '1.6' },
        { id: '59-1/1.7', left: '59', right: '1.7', leftAlts: ['59', '58.8', '58.82'] },
        { id: '56-1/1.8', left: '56', right: '1.8', leftAlts: ['56', '55.6', '55.56'] },
        { id: '53-1/1.9', left: '53', right: '1.9', leftAlts: ['53', '52.6', '52.63'] },
      ];

      const STORAGE_KEY = 'pct-frac-quiz-stats-v1';

      /** @type {{id:string, hide:'left'|'right'}[]} */
      let session = [];
      let startedAt = 0;
      let timerId = null;
      let checked = false;
      let showWrongOnly = false;

      const $ = (sel) => document.querySelector(sel);
      const quizEl = $('#quiz');
      const progressText = $('#progressText');
      const accuracyText = $('#accuracyText');
      const timerText = $('#timerText');
      const resultPanel = $('#resultPanel');
      const btnShowWrong = $('#btnShowWrong');
      const btnShowWrongMobile = $('#btnShowWrongMobile');

      function setShowWrongVisible(visible) {
        [btnShowWrong, btnShowWrongMobile].forEach(function (btn) {
          if (!btn) return;
          if (visible) btn.classList.remove('hidden');
          else btn.classList.add('hidden');
        });
      }

      function setShowWrongLabel(text) {
        [btnShowWrong, btnShowWrongMobile].forEach(function (btn) {
          if (btn) btn.textContent = text;
        });
      }

      function loadStats() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return { rounds: [], miss: {} };
          }
          const data = JSON.parse(raw);
          return {
            rounds: Array.isArray(data.rounds) ? data.rounds : [],
            miss: data.miss && typeof data.miss === 'object' ? data.miss : {},
          };
        } catch (e) {
          return { rounds: [], miss: {} };
        }
      }

      function saveStats(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function formatTime(ms) {
        const s = Math.floor(ms / 1000);
        const m = Math.floor(s / 60);
        const r = s % 60;
        return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      }

      function startTimer() {
        if (timerId) clearInterval(timerId);
        startedAt = Date.now();
        timerText.textContent = '00:00';
        timerId = setInterval(function () {
          timerText.textContent = formatTime(Date.now() - startedAt);
        }, 1000);
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function normalize(str) {
        return String(str || '')
          .trim()
          .replace(/\s+/g, '')
          .replace(/％/g, '%')
          .replace(/／/g, '/')
          .replace(/．/g, '.')
          .toLowerCase();
      }

      /** 从用户输入中取出纯数字（可带小数） */
      function parseNumber(s) {
        let n = normalize(s);
        if (!n) return null;
        // 若误写了 % 或 1/xx，尽量提取数字
        if (n.indexOf('/') !== -1) {
          const parts = n.split('/');
          n = parts[parts.length - 1];
        }
        n = n.replace(/%$/, '');
        if (!/^-?\d+(\.\d+)?$/.test(n)) return null;
        return parseFloat(n);
      }

      function displayLeft(eq) {
        return eq.left + '%';
      }

      function displayRight(eq) {
        return '1/' + eq.right;
      }

      /**
       * @param {string} userRaw
       * @param {string} expected 标准答案数字
       * @param {string[]|undefined} alts
       * @param {'left'|'right'} side
       */
      function answersMatch(userRaw, expected, alts, side) {
        const u = parseNumber(userRaw);
        if (u === null) return false;

        const candidates = [expected].concat(alts || []);
        for (let i = 0; i < candidates.length; i++) {
          const c = parseNumber(candidates[i]);
          if (c === null) continue;
          if (side === 'left') {
            // 百分比：整数级约 0.6，小数级约 0.05
            const tol = c >= 10 ? 0.6 : 0.05;
            if (Math.abs(u - c) <= tol) return true;
          } else {
            // 分母：精确到小数点后 2 位量级
            if (Math.abs(u - c) < 1e-6) return true;
          }
        }
        return false;
      }

      function newSession() {
        checked = false;
        showWrongOnly = false;
        setShowWrongVisible(false);
        setShowWrongLabel('只看错题');
        resultPanel.classList.add('hidden');
        accuracyText.textContent = '—';
        accuracyText.className = 'ml-1 font-medium tabular-nums text-slate-400';

        const order = shuffle(EQUATIONS.map(function (eq) { return eq.id; }));
        session = order.map(function (id) {
          return {
            id: id,
            hide: Math.random() < 0.5 ? 'left' : 'right',
          };
        });

        renderQuiz();
        startTimer();
        updateProgress();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function getEq(id) {
        for (let i = 0; i < EQUATIONS.length; i++) {
          if (EQUATIONS[i].id === id) return EQUATIONS[i];
        }
        return null;
      }

      function renderQuiz() {
        const frag = document.createDocumentFragment();
        const grid = document.createElement('div');
        grid.className = 'quiz-grid divide-y divide-slate-100 md:divide-y-0';

        session.forEach(function (item, index) {
          const eq = getEq(item.id);
          if (!eq) return;

          const row = document.createElement('div');
          row.className = 'eq-row px-2.5 sm:px-4 py-3 sm:py-2.5 flex flex-wrap sm:flex-nowrap items-center gap-x-2 gap-y-1 fade-in border-b border-slate-100';
          row.style.animationDelay = Math.min(index, 20) * 12 + 'ms';
          row.dataset.id = item.id;
          row.dataset.hide = item.hide;

          const num = document.createElement('span');
          num.className = 'w-6 sm:w-7 shrink-0 text-xs text-slate-400 tabular-nums text-right';
          num.textContent = String(index + 1);

          const main = document.createElement('div');
          main.className = 'eq-main';

          const leftWrap = document.createElement('div');
          leftWrap.className = 'eq-side left';

          const rightWrap = document.createElement('div');
          rightWrap.className = 'eq-side right';

          const eqSign = document.createElement('span');
          eqSign.className = 'shrink-0 text-slate-400 font-medium px-0.5 sm:px-1';
          eqSign.textContent = '=';

          if (item.hide === 'left') {
            const unit = document.createElement('span');
            unit.className = 'eq-unit';
            const input = document.createElement('input');
            input.type = 'text';
            input.inputMode = 'decimal';
            input.enterKeyHint = 'next';
            input.className = 'eq-input';
            input.placeholder = '?';
            input.autocomplete = 'off';
            input.autocapitalize = 'off';
            input.spellcheck = false;
            input.dataset.role = 'answer';
            input.setAttribute('aria-label', '填写百分比数值');
            const pct = document.createElement('span');
            pct.className = 'eq-affix';
            pct.textContent = '%';
            unit.appendChild(input);
            unit.appendChild(pct);
            leftWrap.appendChild(unit);
          } else {
            const span = document.createElement('span');
            span.className = 'eq-affix';
            span.textContent = displayLeft(eq);
            leftWrap.appendChild(span);
          }

          if (item.hide === 'right') {
            const unit = document.createElement('span');
            unit.className = 'eq-unit';
            const prefix = document.createElement('span');
            prefix.className = 'eq-affix';
            prefix.textContent = '1/';
            const input = document.createElement('input');
            input.type = 'text';
            input.inputMode = 'decimal';
            input.enterKeyHint = 'next';
            input.className = 'eq-input';
            input.placeholder = '?';
            input.autocomplete = 'off';
            input.autocapitalize = 'off';
            input.spellcheck = false;
            input.dataset.role = 'answer';
            input.setAttribute('aria-label', '填写分母');
            unit.appendChild(prefix);
            unit.appendChild(input);
            rightWrap.appendChild(unit);
          } else {
            const span = document.createElement('span');
            span.className = 'eq-affix';
            span.textContent = displayRight(eq);
            rightWrap.appendChild(span);
          }

          main.appendChild(leftWrap);
          main.appendChild(eqSign);
          main.appendChild(rightWrap);

          const hint = document.createElement('span');
          hint.className = 'answer-hint basis-full sm:basis-auto';
          hint.dataset.role = 'hint';

          row.appendChild(num);
          row.appendChild(main);
          row.appendChild(hint);
          grid.appendChild(row);
        });

        frag.appendChild(grid);
        quizEl.innerHTML = '';
        quizEl.appendChild(frag);

        const inputs = Array.prototype.slice.call(quizEl.querySelectorAll('input[data-role="answer"]'));
        inputs.forEach(function (input, idx) {
          input.addEventListener('input', updateProgress);
          if (idx === inputs.length - 1) {
            input.enterKeyHint = 'done';
          }
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              if (idx < inputs.length - 1) {
                inputs[idx + 1].focus();
              } else {
                checkAnswers();
              }
            }
          });
        });

        // 手机端不强行聚焦，避免一打开就弹出键盘
        if (window.matchMedia('(min-width: 768px)').matches) {
          const first = inputs[0];
          if (first) setTimeout(function () { first.focus(); }, 80);
        }
      }

      function updateProgress() {
        const inputs = quizEl.querySelectorAll('input[data-role="answer"]');
        let filled = 0;
        inputs.forEach(function (el) {
          if (normalize(el.value)) filled++;
        });
        progressText.textContent = filled + ' / ' + session.length;
      }

      function checkAnswers() {
        const stats = loadStats();
        let correct = 0;
        let wrong = 0;
        const wrongItems = [];

        session.forEach(function (item) {
          const eq = getEq(item.id);
          const row = quizEl.querySelector('.eq-row[data-id="' + CSS.escape(item.id) + '"]');
          if (!eq || !row) return;

          const input = row.querySelector('input[data-role="answer"]');
          const hint = row.querySelector('[data-role="hint"]');
          const expected = item.hide === 'left' ? eq.left : eq.right;
          const alts = item.hide === 'left' ? eq.leftAlts : eq.rightAlts;
          const ok = answersMatch(input ? input.value : '', expected, alts, item.hide);

          row.classList.remove('correct-row', 'wrong-row', 'shake');
          if (input) {
            input.classList.remove('correct', 'wrong');
            input.readOnly = true;
          }

          if (ok) {
            correct++;
            row.classList.add('correct-row');
            if (input) input.classList.add('correct');
            if (hint) {
              hint.classList.remove('is-visible');
              hint.innerHTML = '';
            }
          } else {
            wrong++;
            row.classList.add('wrong-row', 'shake');
            if (input) input.classList.add('wrong');
            if (hint) {
              hint.classList.add('is-visible');
              hint.innerHTML = '正确 → <span class="text-secondary font-medium">' + escapeHtml(expected) + '</span>';
            }
            wrongItems.push({
              id: item.id,
              leftLabel: displayLeft(eq),
              rightLabel: displayRight(eq),
              hide: item.hide,
              user: input ? input.value.trim() : '',
              expected: expected,
            });
            if (!stats.miss[item.id]) {
              stats.miss[item.id] = { count: 0, left: displayLeft(eq), right: displayRight(eq) };
            }
            stats.miss[item.id].count += 1;
            stats.miss[item.id].left = displayLeft(eq);
            stats.miss[item.id].right = displayRight(eq);
          }
        });

        const total = session.length;
        const acc = total ? Math.round((correct / total) * 1000) / 10 : 0;
        const elapsed = Date.now() - startedAt;
        stopTimer();
        timerText.textContent = formatTime(elapsed);

        accuracyText.textContent = acc + '%';
        accuracyText.className = 'ml-1 font-medium tabular-nums ' +
          (acc >= 90 ? 'text-secondary' : acc >= 70 ? 'text-warn' : 'text-danger');

        $('#resTotal').textContent = String(total);
        $('#resCorrect').textContent = String(correct);
        $('#resWrong').textContent = String(wrong);
        $('#resAcc').textContent = acc + '%';

        const list = $('#wrongList');
        if (wrongItems.length === 0) {
          list.innerHTML = '<p class="text-secondary text-center py-2"><i class="fa fa-smile-o mr-1"></i>全部正确，太棒了！</p>';
        } else {
          list.innerHTML = '<p class="text-slate-600 mb-2 font-medium">错题回顾（' + wrongItems.length + '）</p>' +
            wrongItems.map(function (w, i) {
              const userShow = w.user ? escapeHtml(w.user) : '<span class="text-slate-400">（未填）</span>';
              return (
                '<div class="rounded-lg bg-red-50/80 px-3 py-2.5">' +
                  '<div class="flex items-baseline gap-2">' +
                    '<span class="text-slate-400 text-xs shrink-0">' + (i + 1) + '</span>' +
                    '<span class="font-medium break-all">' + escapeHtml(w.leftLabel) + ' = ' + escapeHtml(w.rightLabel) + '</span>' +
                  '</div>' +
                  '<div class="mt-1 pl-5 text-xs sm:text-sm text-slate-600">' +
                    '你填了 <span class="text-danger font-medium">' + userShow + '</span>' +
                    ' · 正确为 <span class="text-secondary font-medium">' + escapeHtml(w.expected) + '</span>' +
                  '</div>' +
                '</div>'
              );
            }).join('');
        }

        resultPanel.classList.remove('hidden');
        setShowWrongVisible(true);
        checked = true;

        // 收起手机键盘
        if (document.activeElement && document.activeElement.blur) {
          document.activeElement.blur();
        }

        stats.rounds.push({
          at: Date.now(),
          correct: correct,
          total: total,
          accuracy: acc,
          elapsedMs: elapsed,
          wrongIds: wrongItems.map(function (w) { return w.id; }),
        });
        // 只保留最近 100 轮
        if (stats.rounds.length > 100) {
          stats.rounds = stats.rounds.slice(-100);
        }
        saveStats(stats);

        resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function toggleWrongOnly() {
        if (!checked) return;
        showWrongOnly = !showWrongOnly;
        setShowWrongLabel(showWrongOnly ? '显示全部' : '只看错题');
        quizEl.querySelectorAll('.eq-row').forEach(function (row) {
          if (showWrongOnly) {
            row.style.display = row.classList.contains('wrong-row') ? '' : 'none';
          } else {
            row.style.display = '';
          }
        });
      }

      function openStats() {
        const stats = loadStats();
        const rounds = stats.rounds;
        $('#histRounds').textContent = String(rounds.length);

        if (rounds.length) {
          const sum = rounds.reduce(function (a, r) { return a + r.accuracy; }, 0);
          const avg = Math.round((sum / rounds.length) * 10) / 10;
          const best = Math.max.apply(null, rounds.map(function (r) { return r.accuracy; }));
          $('#histAvg').textContent = avg + '%';
          $('#histBest').textContent = best + '%';
        } else {
          $('#histAvg').textContent = '—';
          $('#histBest').textContent = '—';
        }

        const missEntries = Object.keys(stats.miss).map(function (id) {
          return { id: id, count: stats.miss[id].count, left: stats.miss[id].left, right: stats.miss[id].right };
        }).filter(function (x) { return x.count > 0; })
          .sort(function (a, b) { return b.count - a.count; });

        const rankEl = $('#missRank');
        const emptyEl = $('#missEmpty');
        if (!missEntries.length) {
          rankEl.innerHTML = '';
          emptyEl.classList.remove('hidden');
        } else {
          emptyEl.classList.add('hidden');
          const maxCount = missEntries[0].count;
          rankEl.innerHTML = missEntries.slice(0, 20).map(function (m, i) {
            const pct = Math.round((m.count / maxCount) * 100);
            return (
              '<div class="rounded-lg border border-slate-100 px-3 py-2">' +
                '<div class="flex justify-between gap-2 mb-1">' +
                  '<span class="font-medium">' + (i + 1) + '. ' + escapeHtml(m.left) + ' = ' + escapeHtml(m.right) + '</span>' +
                  '<span class="text-danger tabular-nums shrink-0">错 ' + m.count + ' 次</span>' +
                '</div>' +
                '<div class="stat-bar"><span style="width:' + pct + '%"></span></div>' +
              '</div>'
            );
          }).join('');
        }

        const modal = $('#statsModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      function closeStats() {
        const modal = $('#statsModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }

      $('#btnNew').addEventListener('click', function () {
        if (checked || confirm('确定重新出题？当前填写内容将清空。')) {
          newSession();
        }
      });
      function bindCheck(btn) {
        if (btn) btn.addEventListener('click', checkAnswers);
      }
      function bindShowWrong(btn) {
        if (btn) btn.addEventListener('click', toggleWrongOnly);
      }
      bindCheck($('#btnCheck'));
      bindCheck($('#btnCheckMobile'));
      bindShowWrong(btnShowWrong);
      bindShowWrong(btnShowWrongMobile);
      $('#btnStats').addEventListener('click', openStats);
      $('#btnCloseStats').addEventListener('click', closeStats);
      $('#statsModal').addEventListener('click', function (e) {
        if (e.target === $('#statsModal')) closeStats();
      });
      $('#btnClearStats').addEventListener('click', function () {
        if (confirm('确定清空所有练习统计？此操作不可恢复。')) {
          saveStats({ rounds: [], miss: {} });
          openStats();
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeStats();
      });

      newSession();
    })();
  </script>
</body>
</html>
